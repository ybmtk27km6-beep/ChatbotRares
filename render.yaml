services:
  - type: web
    name: local-ai-studio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 8 --timeout 180 app:app
    healthCheckPath: /
    envVars:
      - key: AI_PROVIDER
        value: auto
      - key: APP_MODE
        value: public
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: OLLAMA_MODEL
        value: qwen2.5:14b
      - key: CLOUD_VISION_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
